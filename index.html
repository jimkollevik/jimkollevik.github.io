<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jim Kollevik</title>
    <meta
        name="description"
        content="AI-powered portfolio. Ask anything about Jim Kollevik's projects, experience and technical background."
    >
    <meta name="title" content="Jim Kollevik">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="default.css?v=6">
</head>

<body class="intro-pending">
    <main class="page">
        <section class="chat-section">
            <div class="terminal" aria-label="Chat with Jim's AI portfolio">
                <div id="chat-box" class="chat-box">
                    <article class="message agent intro-message">
                        <p
                            id="typed-intro"
                            class="typed-intro"
                            aria-label="Hi, I'm Jim."
                        ></p>
                    </article>
                </div>

                <div id="loading-state" class="loading-state hidden">
                    <span class="loading-dot"></span>
                    <p>Looking through my portfolio...</p>
                </div>

                <div class="input-wrapper">
                    <span class="prompt-symbol" aria-hidden="true">&gt;</span>

                    <input
                        id="user-input"
                        type="text"
                        maxlength="800"
                        placeholder="Ask me anything..."
                        onkeypress="handleKeyPress(event)"
                        autocomplete="off"
                    >

                    <button
                        id="send-button"
                        type="button"
                        onclick="handleSend()"
                        aria-label="Send message"
                        title="Send (Enter)"
                    >
                        <span aria-hidden="true">↵</span>
                    </button>
                </div>
            </div>

            <section class="topics">
                <p class="topics-title">Ask about</p>

                <div class="topics-row">
                    <button
                        class="topic"
                        onclick="sendSuggestion('Tell me about your experience.')"
                    >Experience</button>

                    <button
                        class="topic"
                        onclick="sendSuggestion('What projects have you built?')"
                    >Projects</button>

                    <button
                        class="topic"
                        onclick="sendSuggestion('What technologies do you use?')"
                    >Tech Stack</button>

                    <button
                        class="topic"
                        onclick="sendSuggestion('How do you approach problem solving?')"
                    >Problem Solving</button>

                    <button
                        class="topic"
                        onclick="sendSuggestion('Tell me about your AI experience.')"
                    >AI</button>

                    <button
                        class="topic"
                        onclick="sendSuggestion('Tell me about your Marketing Automation experience.')"
                    >Marketing Automation</button>
                </div>
            </section>
        </section>
    </main>

    <script src="app.js?v=6"></script>
</body>
</html>
